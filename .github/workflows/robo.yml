name: Coletor WSL

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - run: python coletor.py

      - name: Publicar
        run: |
          git config user.name "robo-wsl"
          git config user.email "robo@users.noreply.github.com"
          git add app.json estado.json
          git diff --staged --quiet || git commit -m "atualiza baterias"
          git push
